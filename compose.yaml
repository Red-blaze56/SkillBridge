# Services for local development: `docker compose up -d`.
# Ports are bound to 127.0.0.1, so nothing is reachable from your network.
services:
  mongo:
    image: mongo:8.0
    # A single-node replica set: MongoDB only offers transactions and change streams on one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Starts the replica set on first boot, then just reports its status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      # Local-only defaults. Override them in a root .env file if you like.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-skillbridge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-skillbridge-dev}
    ports:
      - "127.0.0.1:5672:5672" # AMQP, for the agent workers
      - "127.0.0.1:15672:15672" # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # The mock-interview service (services/interview) and its own database.
  # Secrets come from the root .env file (see .env.example).
  interview-db:
    image: postgres:16
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${INTERVIEW_DB_PASSWORD:-interview-dev}
      POSTGRES_DB: interview
    volumes:
      - interview-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: only the interview service talks to this database.

  interview:
    build:
      context: services/interview
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://interview:${INTERVIEW_DB_PASSWORD:-interview-dev}@interview-db:5432/interview
      SERVICE_TOKEN: ${INTERVIEW_SERVICE_TOKEN:-}
      LLM_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      interview-db:
        condition: service_healthy
    ports:
      # Only SkillBridge's API calls this, with the service token. Local only.
      - "127.0.0.1:8100:8000"

volumes:
  mongo-data:
  interview-data:
