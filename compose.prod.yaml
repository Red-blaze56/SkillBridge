# Production on one server, layered on compose.yaml (see deploy/README.md):
#
#   docker compose -p skillbridge -f compose.yaml -f compose.prod.yaml --env-file deploy/.env.prod up -d --build
#
# Only Nginx ("web") is reachable from outside. MongoDB, RabbitMQ, Postgres and the
# interview service have no published ports and are reached only on Docker's own network.

x-node: &node
  build:
    context: .
    dockerfile: deploy/node.Dockerfile
  image: skillbridge-node:latest
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-backend-env: &backend-env
  NODE_ENV: production
  MONGODB_URI: mongodb://mongo:27017/skillbridge?directConnection=true
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-skillbridge}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env.prod}@rabbitmq:5672
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}

services:
  mongo:
    ports: !reset []
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1 # no management UI in production
    ports: !reset []
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-skillbridge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env.prod}

  interview-db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${INTERVIEW_DB_PASSWORD:?set INTERVIEW_DB_PASSWORD in deploy/.env.prod}

  interview:
    ports: !reset []
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://interview:${INTERVIEW_DB_PASSWORD}@interview-db:5432/interview
      SERVICE_TOKEN: ${INTERVIEW_SERVICE_TOKEN:?set INTERVIEW_SERVICE_TOKEN in deploy/.env.prod}

  api:
    <<: *node
    command: ["node", "apps/api/src/server.ts"]
    environment:
      <<: *backend-env
      PORT: 4000
      # The address students open. Requests that change data must come from it.
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in deploy/.env.prod}
      # Exactly one proxy in front: Nginx.
      TRUST_PROXY: 1
      INTERVIEW_SERVICE_URL: http://interview:8000
      INTERVIEW_SERVICE_TOKEN: ${INTERVIEW_SERVICE_TOKEN}
      INTERVIEWS_PER_DAY: ${INTERVIEWS_PER_DAY:-3}
      ANALYSES_PER_DAY: ${ANALYSES_PER_DAY:-10}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  evidence-worker:
    <<: *node
    command: ["node", "workers/evidence/src/main.ts"]
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in deploy/.env.prod}

  jobs-worker:
    <<: *node
    command: ["node", "workers/jobs/src/main.ts"]
    environment:
      <<: *backend-env

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: skillbridge-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      # Who the student is, as Nginx tells the API; compose.tunnel.yaml changes these.
      CLIENT_IP: $$remote_addr
      FORWARDED_PROTO: $$scheme
